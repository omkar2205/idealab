name: Add IdeaLab media UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-media-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply media UI patch
        run: python scripts/add_media_ui.py
      - name: Commit media UI
        run: |
          git config user.name "P Omkareshwar Reddy"
          git config user.email "coolomkar11@gmail.com"
          git add app.js
          git commit -m "Add media attachments to idea details"
          git push
