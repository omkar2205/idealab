name: Weekly Review Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/weekly-review-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply weekly review workspace
        run: python scripts/weekly_review_workspace.py
      - name: Correct generated review block
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          marker="\n  }\n  async function createReview(){"
          if marker not in s:
              raise SystemExit('review correction marker not found')
          s=s.replace(marker,"\n  async function createReview(){",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: node --check app.js
      - name: Verify review markers
        run: |
          grep -q 'function renderWeeklyReviewWorkspace' app.js
          grep -q 'Save & next' app.js
          grep -q 'Weekly review workspace' styles.css
      - name: Commit fix
        run: |
          git config user.name "P Omkareshwar Reddy"
          git config user.email "coolomkar11@gmail.com"
          git add app.js styles.css
          git commit -m "Build functional weekly review workspace"
          git push
