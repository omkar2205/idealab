name: IdeaLab smoke check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Check required frontend files
        run: |
          test -s index.html
          test -s styles.css
          test -s config.js
          test -s app.js

      - name: Ping Supabase gateway
        env:
          IDEALAB_API: https://raspnyrkjhgsydtcdrta.supabase.co/functions/v1/idealab-gateway
        run: |
          curl --fail --silent --show-error --location \
            -H "Content-Type: application/json" \
            -d '{"action":"ping","data":{}}' \
            "$IDEALAB_API" --output backend.json
          node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('backend.json','utf8')); if(!data.ok || data.backend!=='supabase' || data.storage!=='google-drive' || !data.googleConfigured) { console.error(data); process.exit(1); } console.log('Gateway OK. Storage mode:', data.storage);"

      - name: Verify Google Sheet and Drive access
        env:
          IDEALAB_HEALTH: https://raspnyrkjhgsydtcdrta.supabase.co/functions/v1/bootstrap-users
        run: |
          curl --fail --silent --show-error --location "$IDEALAB_HEALTH" --output google-health.json
          node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('google-health.json','utf8')); if(!data.ok || !data.googleAuth || !data.sheets || !data.drive) { console.error(data); process.exit(1); } console.log('Google auth, Sheets and Drive access OK');"
