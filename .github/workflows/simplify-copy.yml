name: Simplify IdeaLab copy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/simplify-copy.yml'

permissions:
  contents: write

jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update interface
        run: python scripts/simplify_idealab.py

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "P Omkareshwar Reddy"
          git config user.email "coolomkar11@gmail.com"
          git add app.js index.html
          git commit -m "Simplify IdeaLab interface"
          git push
