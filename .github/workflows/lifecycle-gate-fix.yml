name: Lifecycle Gate Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lifecycle-gate-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply lifecycle tab gate fix
        run: python scripts/lifecycle_gate_fix.py
      - name: Validate JavaScript
        run: node --check app.js
      - name: Verify gates
        run: |
          grep -q "function detailTabs(){const i=state.currentIdea" app.js
          ! grep -q '>Brainstorm notes<' app.js
      - name: Commit fix
        run: |
          git config user.name "P Omkareshwar Reddy"
          git config user.email "coolomkar11@gmail.com"
          git add app.js
          git commit -m "Gate planning and execution tabs by lifecycle"
          git push
