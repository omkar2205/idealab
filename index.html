<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fb">
  <meta name="description" content="IdeaLab private idea workspace">
  <title>IdeaLab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="bootLoader" class="boot-loader">
    <div class="boot-card" aria-label="Loading IdeaLab">
      <img src="assets/logo.svg" alt="" class="boot-logo">
      <div class="boot-lines"><span></span><span></span><span></span></div>
    </div>
  </div>

  <div id="toastRegion" class="toast-region" aria-live="polite"></div>

  <section id="loginView" class="login-view" hidden>
    <form id="loginForm" class="login-card" autocomplete="on">
      <div class="login-brand">
        <img src="assets/logo.svg" alt="IdeaLab logo" class="login-logo">
        <h1>IdeaLab</h1>
      </div>
      <label class="field">
        <span>Email</span>
        <input id="loginEmail" name="email" type="email" autocomplete="username" placeholder="Email" required>
      </label>
      <label class="field">
        <span>Password</span>
        <span class="password-wrap">
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="Password" required>
          <button class="icon-button password-toggle" type="button" data-password-toggle="loginPassword" aria-label="Show password">
            <svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
          </button>
        </span>
      </label>
      <p id="loginError" class="form-error" hidden></p>
      <button id="loginButton" class="button button-primary button-full" type="submit">Sign in</button>
      <p class="auth-footnote">Limited members only.</p>
    </form>
  </section>

  <div id="appView" class="app-shell" hidden>
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <a class="brand" href="#" data-nav="home" aria-label="IdeaLab home">
          <img src="assets/logo.svg" alt="" class="brand-logo">
          <span class="brand-text">IdeaLab</span>
        </a>
        <button id="sidebarCollapse" class="icon-button sidebar-collapse" aria-label="Collapse navigation" aria-expanded="true">
          <svg viewBox="0 0 24 24"><path d="m14 7-5 5 5 5"/></svg>
        </button>
        <button id="sidebarClose" class="icon-button sidebar-close" aria-label="Close navigation">
          <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-item active" data-nav="home" title="Home">
          <svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20H4v-9.5Z"/><path d="M9 20v-6h6v6"/></svg><span>Home</span>
        </button>
        <button class="nav-item" data-nav="ideas" title="Ideas">
          <svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M8.5 14.5C7 13.5 6 11.8 6 9.8A6 6 0 0 1 18 9.8c0 2-1 3.7-2.5 4.7-.7.5-1 1.1-1 1.8h-5c0-.7-.3-1.3-1-1.8Z"/></svg><span>Ideas</span><span id="navIdeaCount" class="nav-count">0</span>
        </button>
        <button class="nav-item" data-nav="brainstorming" title="Brainstorm">
          <svg viewBox="0 0 24 24"><path d="M4 5h16v11H7l-3 3V5Z"/><path d="M8 9h8M8 12h5"/></svg><span>Brainstorm</span>
        </button>
        <button class="nav-item" data-nav="validation" title="Validate">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4M8.5 11l1.7 1.7 3.5-3.5"/></svg><span>Validate</span>
        </button>
        <button class="nav-item" data-nav="planning" title="Planning">
          <svg viewBox="0 0 24 24"><path d="M7 3h10v4H7zM5 5h2M17 5h2v16H5V5"/><path d="M8 11h8M8 15h8M8 19h5"/></svg><span>Planning</span>
        </button>
        <button class="nav-item" data-nav="execution" title="Execution">
          <svg viewBox="0 0 24 24"><path d="M14 5 19 10M13 6l5 5-8.5 8.5L4 20l.5-5.5L13 6Z"/><path d="m15 4 2-2 5 5-2 2"/></svg><span>Execution</span>
        </button>
        <div class="nav-divider"></div>
        <button class="nav-item" data-nav="reviews" title="Weekly review">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/><path d="m8 15 2 2 5-5"/></svg><span>Weekly review</span>
        </button>
        <button class="nav-item" data-nav="analytics" title="Analytics">
          <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Analytics</span>
        </button>
        <button class="nav-item" data-nav="archive" title="Archive">
          <svg viewBox="0 0 24 24"><path d="M4 7h16v14H4zM3 3h18v4H3zM9 11h6"/></svg><span>Archive</span>
        </button>
        <button class="nav-item" data-nav="profiles" title="Profiles">
          <svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="9" r="2.5"/><path d="M3 20c0-4 2-6 5-6s5 2 5 6M13 15c.7-.7 1.7-1 3-1 3 0 5 2 5 6"/></svg><span>Profiles</span>
        </button>
      </nav>

      <div class="sidebar-profile">
        <button id="profileMenuButton" class="profile-chip" aria-expanded="false">
          <span id="sidebarAvatar" class="avatar">O</span>
          <span class="profile-chip-copy"><strong id="sidebarName">Profile</strong><small>Account</small></span>
          <svg viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></svg>
        </button>
        <div id="profileMenu" class="profile-menu" hidden>
          <button data-nav="profiles">Profiles</button>
          <button id="openPasswordButton">Change password</button>
          <button id="logoutButton">Sign out</button>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <button id="sidebarOpen" class="icon-button floating-menu" aria-label="Open navigation">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div id="pageRoot" class="page-root"></div>
      <div class="floating-actions" aria-label="Quick actions">
        <button id="searchButton" class="floating-action floating-action-secondary" aria-label="Search ideas" title="Search (Ctrl+K)">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
        </button>
        <button id="topAddIdea" class="floating-action floating-action-primary" aria-label="Add idea" title="New idea (N)">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </main>
  </div>

  <div id="sidebarScrim" class="sidebar-scrim" hidden></div>

  <dialog id="quickIdeaDialog" class="modal modal-small">
    <form id="quickIdeaForm" method="dialog">
      <div class="modal-head compact"><h2>New idea</h2><button class="icon-button" type="button" data-close-dialog="quickIdeaDialog" aria-label="Close"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
      <div class="modal-body">
        <label class="field"><span>Idea name</span><input id="quickIdeaTitle" maxlength="180" required autofocus></label>
        <label class="field"><span>One-line concept</span><input id="quickIdeaSummary" maxlength="500"></label>
      </div>
      <div class="modal-actions split"><button id="quickMoreDetails" class="button button-secondary" type="button">Add details</button><button id="quickSaveIdea" class="button button-primary" type="submit">Save idea</button></div>
    </form>
  </dialog>

  <dialog id="ideaDialog" class="modal modal-wide">
    <form id="ideaForm" method="dialog">
      <div class="modal-head"><h2 id="ideaDialogTitle">Idea details</h2><button class="icon-button" type="button" data-close-dialog="ideaDialog" aria-label="Close"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
      <div class="modal-body">
        <input id="ideaId" type="hidden">
        <div class="form-grid form-grid-2">
          <label class="field field-span-2"><span>Idea name</span><input id="ideaTitle" maxlength="180" required></label>
          <label class="field field-span-2"><span>One-line concept</span><input id="ideaSummary" maxlength="500"></label>
          <label class="field"><span>Stage</span><select id="ideaStage"><option>Idea</option><option>Brainstorming</option><option>Validation</option><option>Planning</option><option>Execution</option></select></label>
          <label class="field"><span>Priority</span><select id="ideaPriority"><option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option></select></label>
          <label class="field"><span>Owner</span><select id="ideaOwner"></select></label>
          <label class="field"><span>Category</span><input id="ideaCategory" maxlength="120"></label>
          <label class="field field-span-2"><span>Tags</span><input id="ideaTags" maxlength="1000" placeholder="comma separated"></label>
          <label class="field field-span-2"><span>Notes</span><textarea id="ideaDescription" rows="4" maxlength="6000"></textarea></label>
          <label class="field"><span>Problem</span><textarea id="ideaProblem" rows="3"></textarea></label>
          <label class="field"><span>Proposed solution</span><textarea id="ideaSolution" rows="3"></textarea></label>
          <label class="field"><span>Target user</span><textarea id="ideaTargetUser" rows="3"></textarea></label>
          <label class="field"><span>Why it could work</span><textarea id="ideaWhy" rows="3"></textarea></label>
          <label class="field field-span-2"><span>Next action</span><input id="ideaNextAction" maxlength="500"></label>
          <label class="field"><span>Next action owner</span><select id="ideaNextOwner"><option value="">Not assigned</option></select></label>
          <label class="field"><span>Due date</span><input id="ideaNextDue" type="date"></label>
        </div>
      </div>
      <div class="modal-actions"><button class="button button-secondary" type="button" data-close-dialog="ideaDialog">Cancel</button><button id="saveIdeaButton" class="button button-primary" type="submit">Save</button></div>
    </form>
  </dialog>

  <dialog id="detailDialog" class="modal modal-detail"><div id="ideaDetailRoot"></div></dialog>

  <dialog id="mediaDialog" class="modal modal-media">
    <div class="media-modal-head"><strong id="mediaTitle">Media</strong><button class="icon-button" type="button" data-close-dialog="mediaDialog" aria-label="Close"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
    <div id="mediaPreviewRoot" class="media-preview-root"></div>
  </dialog>

  <dialog id="searchDialog" class="modal modal-search">
    <div class="search-box"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg><input id="globalSearch" autocomplete="off" placeholder="Search ideas"><button class="kbd-button" type="button" data-close-dialog="searchDialog">Esc</button></div>
    <div id="searchResults" class="search-results"></div>
  </dialog>

  <dialog id="passwordDialog" class="modal modal-small">
    <form id="passwordForm" method="dialog">
      <div class="modal-head compact"><h2>Change password</h2><button class="icon-button" type="button" data-close-dialog="passwordDialog" aria-label="Close"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
      <div class="modal-body">
        <label class="field"><span>New password</span><input id="newPassword" type="password" autocomplete="new-password" minlength="10" required></label>
        <label class="field"><span>Confirm password</span><input id="confirmPassword" type="password" autocomplete="new-password" minlength="10" required></label>
        <p id="passwordError" class="form-error" hidden></p>
      </div>
      <div class="modal-actions"><button id="changePasswordButton" class="button button-primary button-full" type="submit">Update password</button></div>
    </form>
  </dialog>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
